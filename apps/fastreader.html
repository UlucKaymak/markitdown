<!DOCTYPE html>
<html lang="en" data-theme="sepia">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Reader by Uluç Kaymak</title>
    <link rel="icon" type="image/png" href="design/favicon/favicon-fastreader.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/open-dyslexic@1.0.3/open-dyslexic-regular.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Roboto&family=Roboto+Mono&family=Roboto+Slab&display=swap">
    <style>
        :root {
            --bg-color: #f4f4f7;
            --card-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border-color: #d2d2d7;
            --primary: #8800ff;
            --secondary-bg: #f5f5f7;
            --highlight-color: #ff3b30;
        }

        [data-theme="dark"] {
            --bg-color: #1c1c1e;
            --card-bg: #2c2c2e;
            --text-main: #f5f5f7;
            --text-muted: #a1a1a6;
            --border-color: #48484a;
            --primary: #923cde;
            --secondary-bg: #3a3a3c;
            --highlight-color: #AF8FE9;
        }

        [data-theme="sepia"] {
            --bg-color: #f1e7d0;
            --card-bg: #fdf6e3;
            --text-main: #586e75;
            --text-muted: #657b83;
            --border-color: #93a1a1;
            --primary: #cb4b16;
            --secondary-bg: #eee8d5;
            --highlight-color: #cb4b16;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        body[data-font="opendyslexic"] {
            font-family: 'OpenDyslexicRegular', sans-serif;
        }

        body[data-font="roboto"] {
            font-family: 'Roboto', sans-serif;
        }

        body[data-font="roboto-mono"] {
            font-family: 'Roboto Mono', monospace;
        }

        body[data-font="roboto-slab"] {
            font-family: 'Roboto Slab', serif;
        }

        #display-container {
            width: 90%;
            max-width: 900px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        #focus-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background-color: var(--primary);
            opacity: 0.5;
        }

        #word-display {
            font-size: 2.8rem;
            font-weight: 700;
            padding: 0 50px;
            text-align: center;
            white-space: nowrap;
        }

        .orp {
            color: var(--highlight-color);
        }

        #progress-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 4px;
            background: var(--primary);
            width: 0%;
            transition: width 0.1s linear;
        }

        .main-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 700px;
            margin-bottom: 10px;
        }

        .buttons-row {
            display: flex;
            gap: 10px;
        }

        #settings-panel,
        #text-input-panel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #settings-panel.hidden,
        #text-input-panel.hidden {
            display: none;
        }

        .controls,
        .text-input-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 700px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            font-size: 1.5rem;
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
        }

        .panel-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0;
            text-align: center;
            color: var(--text-main);
        }

        .upload-btn-styled {
            background-color: var(--primary);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            font-size: 1rem;
            font-weight: 500;
        }

        .submit-text-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            margin-top: 10px;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .settings-divider {
            grid-column: 1 / -1;
            font-weight: bold;
            color: var(--text-muted);
            margin-top: 10px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        input,
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            transition: transform 0.1s;
            outline: 2px solid transparent;
            outline-offset: 2px;
        }



        button:focus-visible {
            outline-color: var(--primary);
        }

        #start-btn {
            background: var(--primary);
            color: white;
        }

        #pause-btn {
            background: var(--secondary-bg);
            color: var(--text-main);
        }

        #settings-btn,
        #add-text-btn {
            background: var(--secondary-bg);
            color: var(--text-main);
            flex: 0.5;
        }

        button:active {
            transform: scale(0.98);
        }

        .hint {
            font-size: 0.8rem;
            text-align: center;
            color: var(--text-muted);
        }

        button i {
            margin-right: 8px;
        }

        /* External Link Styling */
        a[target="_blank"] {
            color: var(--primary);
            text-decoration: none;
        }

        a[target="_blank"]:hover {
            text-decoration: underline;
        }

        .minimal-btn:hover {
            text-decoration: underline;
        }

        /* Mobile-specific styles for settings panel */
        @media (max-width: 768px) {
            .controls {
                max-height: 90vh;
                /* Limit height to 90% of viewport height */
                overflow-y: auto;
                /* Enable vertical scrolling */
                width: 90%;
                /* Ensure it takes up sufficient width */
                -webkit-overflow-scrolling: touch;
                /* For smoother scrolling on iOS */
            }
        }
    </style>
</head>

<body>

    <div id="display-container">
        <div id="focus-line"></div>
        <div id="word-display">Enjoy the Reading!</div>
        <div id="progress-bar"></div>
    </div>

    <div class="main-controls">
        <div class="buttons-row">
            <button id="start-btn"><i class="fas fa-play"></i>Start Reading</button>
            <button id="pause-btn"><i class="fas fa-backward"></i>Rewind</button>
        </div>
        <div class="buttons-row">
            <button id="add-text-btn"><i class="fas fa-plus"></i>Add Text</button>
            <button id="settings-btn"><i class="fas fa-cog"></i>Settings</button>
        </div>
    </div>

    <div id="text-input-panel" class="hidden">
        <div class="controls">
            <button id="close-text-btn" class="close-btn"><i class="fas fa-times"></i></button>
            <h2 class="panel-title">Add Text</h2>
            <div class="settings-grid">
                <div class="input-group" style="grid-column: 1 / -1;">
                    <textarea id="text-input" placeholder="Paste your text here...">
My Love, if you’re reading these lines, it means there’s still something inside your heart that belongs to me.

As I’ve always told you, death is far too ordinary a thing to keep us apart.
I will give birth to our creation in our home, beneath the place we once shared.

You must be with me. Inside me… Because our creation cannot be left undone.
Turn back. Pass through the dark. Complete us.
We were always meant to be one, and we still can be, my love.
As long as you have the courage. As long as you do not fear.

I am waiting for you… in the never-all. </textarea>
                    <!-- This is a letter from a video game called Livber: Smoke and Mirrors by InEvGames -->
                </div>
                <div class="input-group">
                    <button id="upload-btn" class="upload-btn-styled"><i class="fas fa-upload"></i> Upload File</button>
                </div>
            </div>
            <input type="file" id="file-input" accept=".txt" style="display: none;">

        </div>
    </div>

    <div id="settings-panel" class="hidden">
        <div class="controls">
            <button id="close-settings-btn" class="close-btn"><i class="fas fa-times"></i></button>
            <div class="settings-grid">
                <div class="settings-divider">Visual</div>
                <div class="input-group">
                    <label>Font Size</label>
                    <input type="number" id="font-size-input" value="2.5" step="0.1" min="0.5" max="4">
                </div>
                <div class="input-group">
                    <label>Alignment</label>
                    <select id="alignment-input">
                        <option value="left">Centered</option>
                        <option value="center" selected>Centered (ORP)</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Font</label>
                    <select id="font-input">
                        <option value="opendyslexic">OpenDyslexic</option>
                        <option value="system" selected>System</option>
                        <option value="roboto">Roboto</option>
                        <option value="roboto-mono">Roboto Mono</option>
                        <option value="roboto-slab">Roboto Slab</option>
                    </select>
                </div>
                <div class="settings-divider">Reading</div>
                <div class="input-group">
                    <label>WPM Speed</label>
                    <input type="number" id="wpm-input" value="450" step="50">
                </div>
                <div class="input-group">
                    <label>Chunk Size</label>
                    <select id="chunk-input">
                        <option value="1">1 Word</option>
                        <option value="2" selected>2 Words</option>
                        <option value="3">3 Words</option>
                        <option value="4">4 Words</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Spacebar Logic</label>
                    <select id="space-logic">
                        <option value="toggle">Toggle Play/Pause</option>
                        <option value="hold">Run on Hold</option>
                    </select>
                </div>
                <div class="settings-divider">App</div>
                <div class="input-group">
                    <label>Theme</label>
                    <select id="theme-input">
                        <option value="light">Light</option>
                        <option value="sepia" selected>Sepia</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Highlight Color</label>
                    <select id="highlight-color-input">
                        <option value="#d20f39">Red</option>
                        <option value="#8839ef">Purple</option>
                        <option value="#1e66f5">Blue</option>
                        <option value="#40a02b">Green</option>
                        <option value="#FFA31A">Orange</option>
                        <option value="#cb4b16" selected>Idk what is this but works with sepia</option>

                    </select>
                </div>
                <div class="input-group">
                    <label>To Reset Settings</label>
                    <a id="reset-settings-btn" class="minimal-btn">Click Here.</a>
                </div>
                <div class="input-group">
                    <label>To Support Me</label>
                    <a class="minimal-btn" href="https://www.buymeacoffee.com/uluckaymak" target="_blank">Buy me a
                        coffee ☕️</a>
                </div>
            </div>
            <div class="settings-divider">Also</div>
            <div class="hint" id="keyboard-hint"></div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                let chunks = [];
                let currentIndex = 0;
                let intervalId = null;
                let isSpacePressed = false;

                const display = document.getElementById('word-display');
                const progressBar = document.getElementById('progress-bar');
                const input = document.getElementById('text-input');
                const wpmInput = document.getElementById('wpm-input');
                const chunkInput = document.getElementById('chunk-input');
                const themeInput = document.getElementById('theme-input');
                const spaceLogic = document.getElementById('space-logic');
                const alignmentInput = document.getElementById('alignment-input');
                const fontInput = document.getElementById('font-input');
                const fontSizeInput = document.getElementById('font-size-input');
                const highlightColorInput = document.getElementById('highlight-color-input');
                const resetSettingsBtn = document.getElementById('reset-settings-btn');
                const startBtn = document.getElementById('start-btn');
                const rewindBtn = document.getElementById('pause-btn');
                const hintText = document.getElementById('keyboard-hint');
                const settingsBtn = document.getElementById('settings-btn');
                const settingsPanel = document.getElementById('settings-panel');
                const closeSettingsBtn = document.getElementById('close-settings-btn');
                const addTextBtn = document.getElementById('add-text-btn');
                const textInputPanel = document.getElementById('text-input-panel');
                const closeTextBtn = document.getElementById('close-text-btn');
                const uploadBtn = document.getElementById('upload-btn');
                const fileInput = document.getElementById('file-input');


                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');

                function getTextWidth(text, font) {
                    context.font = font;
                    return context.measureText(text).width;
                }

                function saveSettings() {
                    const settings = {
                        wpm: wpmInput.value,
                        chunkSize: chunkInput.value,
                        theme: themeInput.value,
                        spaceLogic: spaceLogic.value,
                        alignment: alignmentInput.value,
                        font: fontInput.value,
                        fontSize: fontSizeInput.value,
                        highlightColor: highlightColorInput.value,
                    };
                    localStorage.setItem('fastReaderSettings', JSON.stringify(settings));
                }

                function applyFontSize(size) {
                    display.style.fontSize = `${size}rem`;
                }

                function applyHighlightColor(color) {
                    document.documentElement.style.setProperty('--highlight-color', color);
                    document.documentElement.style.setProperty('--primary', color);
                }

                function loadSettings() {
                    const settings = JSON.parse(localStorage.getItem('fastReaderSettings'));
                    if (settings) {
                        wpmInput.value = settings.wpm;
                        chunkInput.value = settings.chunkSize;
                        themeInput.value = settings.theme;
                        spaceLogic.value = settings.spaceLogic;
                        alignmentInput.value = settings.alignment;
                        fontInput.value = settings.font;
                        fontSizeInput.value = settings.fontSize || '2.8';
                        highlightColorInput.value = settings.highlightColor || '#ff3b30';

                        document.documentElement.setAttribute('data-theme', settings.theme);
                        document.body.setAttribute('data-font', settings.font);
                        applyFontSize(fontSizeInput.value);
                        applyHighlightColor(highlightColorInput.value);
                    }
                }

                function initializeSettings() {
                    displayRandomHint();
                    loadSettings();
                }

                const hintMessages = [
                    "Having trouble? Reloading the page usually fixes the bugs.",
                    "Found a bug? Reloading the page might fix it!",
                    "You can always contact me by mail.",

                    "Your focus line helps you stay centered while reading.",
                    "Press 'Rewind' to go back one or two words and re-read.",

                    "The highlight color can be changed in settings to suit your preference.",
                    "Adjust WPM and Chunk Size in Settings for a personalized reading experience.",
                    "Spacebar behavior can be toggled between 'Play/Pause' and 'Run on Hold' in Settings.",
                    "Your settings saves on your browser locally.",

                    "You can add this page as an app on nearly every device.",
                    "You can add this page as an app on nearly every device.",
                    "You can use this app offline.",

                    "Made with 🎲 by Uluç Kaymak.",
                    "Made with 🎲 by Uluç Kaymak.",
                    "Found a bug? Mail me: uluckaymak@gmail.com",
                    "Found a bug? Mail me: uluckaymak@gmail.com",
                    "Pls buy me a coffee"
                ];

                function displayRandomHint() {
                    const randomIndex = Math.floor(Math.random() * hintMessages.length);
                    hintText.textContent = hintMessages[randomIndex];
                }

                setInterval(displayRandomHint, 10000);

                themeInput.addEventListener('change', () => {
                    document.documentElement.setAttribute('data-theme', themeInput.value);
                    applyHighlightColor(highlightColorInput.value);
                    saveSettings();
                    reset();
                });

                fontInput.addEventListener('change', () => {
                    document.body.setAttribute('data-font', fontInput.value);
                    saveSettings();
                });

                spaceLogic.addEventListener('change', () => {
                    hintText.textContent = spaceLogic.value === 'toggle' ? 'Tap Space to Play/Pause' : 'Hold Space to Read';
                    saveSettings();
                });

                wpmInput.addEventListener('change', saveSettings);
                chunkInput.addEventListener('change', saveSettings);
                alignmentInput.addEventListener('change', saveSettings);
                fontSizeInput.addEventListener('change', () => {
                    applyFontSize(fontSizeInput.value);
                    saveSettings();
                });

                function getChunks() {
                    const rawWords = input.value.trim().split(/\s+/);
                    const processedWords = rawWords;

                    const chunkSize = parseInt(chunkInput.value);
                    const result = [];
                    let currentChunk = [];

                    for (const word of processedWords) {
                        currentChunk.push(word);
                        const lastChar = word.slice(-1);
                        if (currentChunk.length >= chunkSize || lastChar === '.' || lastChar === '!' || lastChar === '?') {
                            result.push(currentChunk.join(" "));
                            currentChunk = [];
                        }
                    }

                    if (currentChunk.length > 0) {
                        result.push(currentChunk.join(" "));
                    }
                    return result;
                }

                function calculateORP(word) {
                    const len = word.length;
                    if (len <= 1) return 0;
                    if (len <= 4) return 1;
                    if (len <= 8) return 2;
                    return Math.floor(len / 3);
                }

                function formatWord(word) {
                    const orpIndex = calculateORP(word);
                    return word.substring(0, orpIndex) +
                        `<span class="orp">${word[orpIndex]}</span>` +
                        word.substring(orpIndex + 1);
                }

                function updateUI() {
                    if (chunks.length > 0) {
                        const progress = (currentIndex / chunks.length) * 100;
                        progressBar.style.width = `${progress}%`;
                    }
                }

                function displayChunk(index) {
                    if (index < chunks.length) {
                        const currentChunk = chunks[index];
                        const firstWord = currentChunk.split(' ')[0];
                        const formattedChunk = currentChunk.split(' ').map(formatWord).join(' ');

                        display.innerHTML = formattedChunk;

                        if (alignmentInput.value === 'center') {
                            const font = `${getComputedStyle(display).fontWeight} ${getComputedStyle(display).fontSize} ${getComputedStyle(display).fontFamily}`;
                            const widthChunk = getTextWidth(currentChunk, font);
                            const orpIndex = calculateORP(firstWord);
                            const textBeforeOrp = firstWord.substring(0, orpIndex);
                            const orpLetter = firstWord[orpIndex];
                            const widthBeforeOrp = getTextWidth(textBeforeOrp, font);
                            const orpWidth = getTextWidth(orpLetter, font);
                            const offset = (widthChunk / 2) - (widthBeforeOrp + (orpWidth / 2));
                            display.style.transform = `translateX(${offset}px)`;
                        } else {
                            display.style.transform = 'translateX(0)';
                        }
                    }
                }

                function play() {
                    if (intervalId) return;
                    chunks = getChunks();
                    if (chunks.length === 0 || chunks[0] === "") return;

                    const wpm = parseInt(wpmInput.value) || 450;
                    const size = parseInt(chunkInput.value);
                    const delay = (60000 / wpm) * size;

                    startBtn.innerHTML = '<i class="fas fa-pause"></i>Pause';

                    displayChunk(currentIndex);
                    updateUI();
                    currentIndex++;

                    intervalId = setInterval(() => {
                        if (currentIndex < chunks.length) {
                            displayChunk(currentIndex);
                            updateUI();
                            currentIndex++;
                        } else {
                            stopReading();
                            display.textContent = "📕👀⏱️";
                        }
                    }, delay);
                }

                function stopReading() {
                    clearInterval(intervalId);
                    intervalId = null;
                    if (currentIndex >= chunks.length && chunks.length > 0) {
                        startBtn.innerHTML = '<i class="fas fa-redo"></i>Restart';
                    } else {
                        startBtn.innerHTML = '<i class="fas fa-play"></i>' + (currentIndex > 0 ? "Continue" : "Start Reading");
                    }
                    display.style.transform = 'translateX(0)';
                }

                const resetReadingState = () => {
                    stopReading();
                    currentIndex = 0;
                    display.textContent = "Enjoy the Reading!";
                    progressBar.style.width = '0%';
                    startBtn.innerHTML = '<i class="fas fa-play"></i>Start Reading';
                };

                function rewind() {
                    stopReading();
                    currentIndex = Math.max(0, currentIndex - 2);
                    if (chunks.length > 0) {
                        displayChunk(currentIndex);
                    } else {
                        display.textContent = "Enjoy the Reading!";
                    }
                    updateUI();
                }

                function togglePlayPause() {
                    if (intervalId) {
                        stopReading();
                    } else {
                        if (startBtn.innerHTML.includes('Restart')) {
                            resetReadingState();
                            displayChunk(0);
                        } else {
                            play();
                        }
                    }
                }

                window.addEventListener('keydown', (e) => {
                    if (e.code === "Space" && e.target !== input) {
                        e.preventDefault();
                        if (isSpacePressed) return;
                        isSpacePressed = true;

                        if (startBtn.innerHTML.includes('Restart')) {
                            resetReadingState();
                            displayChunk(0);
                            return;
                        }

                        if (spaceLogic.value === 'toggle') {
                            togglePlayPause();
                        } else {
                            play();
                        }
                    }
                });

                window.addEventListener('keyup', (e) => {
                    if (e.code === "Space") {
                        isSpacePressed = false;
                        if (spaceLogic.value === 'hold') {
                            stopReading();
                        }
                    }
                });

                startBtn.addEventListener('click', togglePlayPause);
                rewindBtn.addEventListener('click', rewind);

                settingsBtn.addEventListener('click', () => {
                    settingsPanel.classList.remove('hidden');
                });

                closeSettingsBtn.addEventListener('click', () => {
                    settingsPanel.classList.add('hidden');
                });

                settingsPanel.addEventListener('click', (e) => {
                    if (e.target === settingsPanel) {
                        settingsPanel.classList.add('hidden');
                    }
                });

                addTextBtn.addEventListener('click', () => {
                    textInputPanel.classList.remove('hidden');
                });

                closeTextBtn.addEventListener('click', () => {
                    textInputPanel.classList.add('hidden');
                });

                uploadBtn.addEventListener('click', () => {
                    fileInput.click();
                });

                fileInput.addEventListener('change', (event) => {
                    const file = event.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            input.value = e.target.result;
                            textInputPanel.classList.add('hidden');
                        };
                        reader.readAsText(file);
                    }
                });



                textInputPanel.addEventListener('click', (e) => {
                    if (e.target === textInputPanel) {
                        textInputPanel.classList.add('hidden');
                    }
                });

                const reset = () => {
                    stopReading();
                    currentIndex = 0;
                    display.textContent = "Enjoy the Reading!";
                    progressBar.style.width = '0%';
                };

                fontSizeInput.addEventListener('change', () => {
                    applyFontSize(fontSizeInput.value);
                    saveSettings();
                    reset();
                });

                highlightColorInput.addEventListener('change', () => {
                    applyHighlightColor(highlightColorInput.value);
                    saveSettings();
                    reset();
                });

                resetSettingsBtn.addEventListener('click', () => {
                    localStorage.removeItem('fastReaderSettings');
                    initializeSettings();
                    settingsPanel.classList.add('hidden');
                    resetReadingState();
                });

                input.addEventListener('input', reset);
                chunkInput.addEventListener('change', reset);
                alignmentInput.addEventListener('change', reset);
                fontInput.addEventListener('change', reset);

                initializeSettings();

            });


        </script>
</body>

</html>
