<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Uluç Kaymak</title>
    <link rel="icon" type="image/png" href="/design/favicon-main.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/design/style.css">
    <link rel="stylesheet" href="style.css">
</head>

<body style="padding: 5%;">

    <div>
        <main class="manager-main">
            <header>
                <h2>Portfolio Analytics</h2>
                <p class="manager-intro">Monitor visitor traffic and locations.</p>
            </header>

            <div class="stats-overview">
                <div class="stat-card">
                    <span class="stat-label">Total Visits</span>
                    <span class="stat-value" id="total-visits">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Unique Visitors</span>
                    <span class="stat-value" id="unique-visitors">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Active Countries</span>
                    <span class="stat-value" id="active-countries">0</span>
                </div>
            </div>

            <div class="analytics-grid">
                <section class="chart-section">
                    <h3>Visits Over Time</h3>
                    <div class="chart-container">
                        <canvas id="visits-chart"></canvas>
                        <div id="chart-placeholder" class="placeholder-text">No data available yet</div>
                    </div>
                </section>

                <section class="location-section">
                    <h3>Top Locations</h3>
                    <div id="location-list" class="data-list">
                        <p class="empty-state">No location data yet.</p>
                    </div>
                </section>
            </div>

            <section class="recent-visits">
                <h3>Recent Visits</h3>
                <div class="table-container">
                    <table id="visits-table">
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Page</th>
                                <th>Location</th>
                                <th>IP (Partial)</th>
                                <th>Device</th>
                            </tr>
                        </thead>
                        <tbody id="visits-tbody">
                            <!-- Data will be populated here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="js/main.js"></script>
</body>

</html>
