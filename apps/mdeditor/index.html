<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal Markdown Editor</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="header-content">
        <h1>📝 Markdown Editor</h1>
    </div>
</header>

<div class="container">
    <div class="editor-pane">
        <div class="toolbar">
            <button onclick="insertFormat('**', '**')" title="Kalın"><b>B</b></button>
            <button onclick="insertFormat('*', '*')" title="İtalik"><i>I</i></button>
            <button onclick="insertFormat('~~', '~~')" title="Üstü Çizili"><s>S</s></button>
            <button onclick="insertFormat('# ', '')" title="Başlık 1">H1</button>
            <button onclick="insertFormat('## ', '')" title="Başlık 2">H2</button>
            <button onclick="insertFormat('### ', '')" title="Başlık 3">H3</button>
            <button onclick="insertFormat('`', '`')" title="Kod">Code</button>
            <button onclick="insertFormat('```\n', '\n```')" title="Kod Bloğu">Block</button>
            <button onclick="insertFormat('[', '](url)')" title="Link">Link</button>
            <button onclick="insertFormat('![', '](https://via.placeholder.com/150)')" title="Resim">Resim</button>
            <button onclick="insertTable()" title="Tablo">Tablo</button>
        </div>
        <textarea id="editor" placeholder="Markdown yazmaya başlayın..."></textarea>
    </div>
    
    <div id="preview"></div>
</div>

<script src="script.js"></script>

</body>
</html>
