<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkItDown - Markdown Editor</title>
    <meta name="description" content="A minimal Markdown editor. Built by Uluç Kaymak.">

    <meta property="og:title" content="MarkItDown">
    <meta property="og:description" content="A minimal Markdown editor. Built by Uluç Kaymak.">
    <meta property="og:image" content="/apps/markitdown/favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e2e">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;700;900&family=Indie+Flower&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <link rel="stylesheet" href="markitdown.css">
</head>

<body class="theme-dim font-serif">
    <div id="root">
        <header id="toolbar" class="hidden">
            <button onclick="insertText('**','**')" title="Bold" class="t-btn"><svg viewBox="0 0 24 24">
                    <path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"></path>
                </svg></button>
            <button onclick="insertText('_','_')" title="Italic" class="t-btn"><svg viewBox="0 0 24 24">
                    <line x1="19" x2="10" y1="4" y2="4"></line>
                    <line x1="14" x2="5" y1="20" y2="20"></line>
                    <line x1="15" x2="9" y1="4" y2="20"></line>
                </svg></button>
            <div style="width:1px; height:20px; background:rgba(127,127,127,0.15); margin:0 4px;"></div>
            <button onclick="insertText('# ')" class="t-btn" style="font-weight:900; font-size:10px;">H1</button>
            <button onclick="insertText('## ')" class="t-btn" style="font-weight:900; font-size:10px;">H2</button>
            <button onclick="insertText('### ')" class="t-btn" style="font-weight:900; font-size:10px;">H3</button>
            <div style="width:1px; height:20px; background:rgba(127,127,127,0.15); margin:0 4px;"></div>
            <button onclick="insertText('\n- ')" title="List" class="t-btn"><svg viewBox="0 0 24 24">
                    <path d="M3 5h.01"></path>
                    <path d="M3 12h.01"></path>
                    <path d="M3 19h.01"></path>
                    <path d="M8 5h13"></path>
                    <path d="M8 12h13"></path>
                    <path d="M8 19h13"></path>
                </svg></button>
            <button onclick="insertText('`','`')" title="Code" class="t-btn"><svg viewBox="0 0 24 24">
                    <path d="m16 18 6-6-6-6"></path>
                    <path d="m8 6-6 6 6 6"></path>
                </svg></button>
            <button onclick="insertText('[','](url)')" title="Link" class="t-btn"><svg viewBox="0 0 24 24">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg></button>
            <button onclick="insertImage()" title="Image" class="t-btn"><svg viewBox="0 0 24 24">
                    <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
                    <circle cx="9" cy="9" r="2"></circle>
                    <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path>
                </svg></button>
            <button onclick="insertTable()" title="Table" class="t-btn"><svg viewBox="0 0 24 24">
                    <path d="M12 3v18"></path>
                    <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                    <path d="M3 9h18"></path>
                    <path d="M3 15h18"></path>
                </svg></button>
            <button onclick="insertText('    ')" title="Indent" class="t-btn"><svg viewBox="0 0 24 24">
                    <path d="M21 5H11"></path>
                    <path d="M21 12H11"></path>
                    <path d="M21 19H11"></path>
                    <path d="m3 8 4 4-4 4"></path>
                </svg></button>
            <div style="width:1px; height:20px; background:rgba(127,127,127,0.15); margin:0 8px;"></div>
            <div class="pill">
                <button id="btn-editing" onclick="setMode('editing')" class="pill-btn"><svg viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M13 21h8"></path>
                        <path
                            d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z">
                        </path>
                    </svg></button>
                <button id="btn-split" onclick="setMode('split')" class="pill-btn"><svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2"></rect>
                        <path d="M12 3v18"></path>
                    </svg></button>
                <button id="btn-sync" onclick="setMode('sync')" class="pill-btn"><svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                    </svg></button>
                <button id="btn-reading" onclick="setMode('reading')" class="pill-btn"><svg viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path
                            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0">
                        </path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg></button>
            </div>
        </header>

        <main>
            <div id="editor-container"
                style="width: 50%; border-right: 1px solid var(--border); display:flex; justify-content:center;">
                <textarea id="editor" spellcheck="false"></textarea>
            </div>
            <div id="resizer"></div>
            <div id="preview-container" style="flex: 1; overflow-y:auto;">
                <div id="preview" class="markdown-body"></div>
            </div>

            <!-- Settings Panel -->
            <div id="settings-panel" class="hidden panel">
                <div class="row" style="margin-bottom:24px; opacity:1;">
                    <span id="version-display" onclick="checkForUpdates()"
                        style="font-weight:900; letter-spacing:2px; font-size:10px; opacity:0.3; cursor:pointer;" title="Click to check for updates"></span>
                    <button id="update-btn" onclick="updateApp()" class="hidden"
                        style="color:var(--accent-color); background:none; border:1px solid var(--border); cursor:pointer; font-weight:900; font-size:9px; padding:2px 6px; border-radius:4px; margin-left:8px; animation: blink 1s infinite;">UPDATE
                        AVAILABLE</button>
                    <button onclick="toggleSettings()"
                        style="color:var(--accent-color); background:none; border:none; cursor:pointer; font-weight:900; font-size:9px; letter-spacing:1px; margin-left:auto;">CLOSE</button>
                </div>

                <div class="row">
                    <span>Theme</span>
                    <button onclick="cycleTheme()" id="theme-display" class="settings-btn"></button>
                </div>

                <div class="row">
                    <span>Accent</span>
                    <div id="accent-grid" style="display:flex; gap:6px;"></div>
                </div>

                <div class="row">
                    <span>Links</span>
                    <button onclick="toggleLinkTypes()" id="link-types-btn" class="settings-btn"></button>
                </div>

                <div class="row">
                    <span>Alignment</span>
                    <button onclick="toggleTextAlign()" id="align-btn" class="settings-btn"></button>
                </div>

                <div class="row">
                    <span>Size</span>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <button onclick="changeFontSize(-1)"
                            style="border:none; background:none; color:inherit; cursor:pointer; font-size:14px; opacity:0.5;">-</button>
                        <span id="font-val" style="font-size:9px; font-weight:900;">16px</span>
                        <button onclick="changeFontSize(1)"
                            style="border:none; background:none; color:inherit; cursor:pointer; font-size:14px; opacity:0.5;">+</button>
                    </div>
                </div>

                <div style="margin:24px 0 12px; border-top:1px solid var(--border); padding-top:20px;">
                    <div class="row" style="margin-bottom:12px;">
                        <span style="opacity:0.5;">Font Family</span>
                    </div>
                    <div id="font-family-grid" style="display:flex; gap:4px; margin-bottom:20px;"></div>
                </div>

                <div style="margin:24px 0 12px; border-top:1px solid var(--border); padding-top:20px;">
                    <div class="row" style="margin-bottom:12px;">
                        <span style="opacity:0.5;">Front Matter Defaults</span>
                    </div>
                    <div id="fm-prefs-grid" style="display:grid; grid-template-columns: 1fr 1fr; gap:8px;"></div>
                </div>


                <button onclick="resetSettings()" class="reset-btn">RESET SETTINGS</button>
            </div>

            <div id="toc-sidebar" class="panel hidden-panel">
                <div class="row"
                    style="margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                    <span style="opacity:0.4;">Table of Contents</span>
                </div>
                <div id="toc-content"></div>
            </div>

            <div id="recents-sidebar" class="panel hidden-panel">
                <div class="row"
                    style="margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                    <span style="opacity:0.4;">Recent Files</span>
                    <button onclick="clearRecents()" style="background:none; border:none; color:#ff6b6b; cursor:pointer; font:inherit; font-size:9px;">CLEAR</button>
                </div>
                <div id="recents-content"></div>
            </div>
        </main>

        <footer id="footer">
            <div style="display:flex; align-items:center; gap:16px;">
                <span id="mode-text" style="color:var(--accent-color);">READING</span>
                <button onclick="openFile()"
                    style="background:none; border:none; color:inherit; cursor:pointer; font:inherit; opacity:0.5;">OPEN</button>
                <button onclick="newFile()"
                    style="background:none; border:none; color:inherit; cursor:pointer; font:inherit; opacity:0.5;">NEW</button>
            </div>
            <div id="file-info"
                style="opacity:0.4; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
            </div>
            <div style="display:flex; gap:16px;">
                <button onclick="toggleTOC()"
                    style="background:none; border:none; color:inherit; cursor:pointer; font:inherit; opacity:0.5;">TOC</button>
                <button onclick="toggleSettings()"
                    style="background:none; border:none; color:var(--accent-color); cursor:pointer; font:inherit;">SETTINGS</button>
                <div id="footer-actions"></div>
            </div>
        </footer>
    </div>

    <script src="markitdown-core.js"></script>
    <script src="markitdown-ui.js"></script>
</body>

</html>
