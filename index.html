<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkItDown - Markdown Editor</title>
    <meta name="description" content="A minimal Markdown editor. Built by Uluç Kaymak.">
    
    <meta property="og:title" content="MarkItDown">
    <meta property="og:description" content="A minimal Markdown editor. Built by Uluç Kaymak.">
    <meta property="og:image" content="/apps/markitdown/favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e2e">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..800&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dim font-serif">
    <div id="root">
        <header id="toolbar" class="hidden">
            <button onclick="insertText('**','**')" title="Bold" class="t-btn"><svg viewBox="0 0 24 24"><path d="M6 12h9a4 4 0 0 1 0 8H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h7a4 4 0 0 1 0 8"></path></svg></button>
            <button onclick="insertText('_','_')" title="Italic" class="t-btn"><svg viewBox="0 0 24 24"><line x1="19" x2="10" y1="4" y2="4"></line><line x1="14" x2="5" y1="20" y2="20"></line><line x1="15" x2="9" y1="4" y2="20"></line></svg></button>
            <div style="width:1px; height:20px; background:rgba(127,127,127,0.15); margin:0 4px;"></div>
            <button onclick="insertText('# ')" class="t-btn" style="font-weight:900; font-size:10px;">H1</button>
            <button onclick="insertText('## ')" class="t-btn" style="font-weight:900; font-size:10px;">H2</button>
            <button onclick="insertText('### ')" class="t-btn" style="font-weight:900; font-size:10px;">H3</button>
            <div style="width:1px; height:20px; background:rgba(127,127,127,0.15); margin:0 4px;"></div>
            <button onclick="insertText('\n- ')" title="List" class="t-btn"><svg viewBox="0 0 24 24"><path d="M3 5h.01"></path><path d="M3 12h.01"></path><path d="M3 19h.01"></path><path d="M8 5h13"></path><path d="M8 12h13"></path><path d="M8 19h13"></path></svg></button>
            <button onclick="insertText('`','`')" title="Code" class="t-btn"><svg viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"></path><path d="m8 6-6 6 6 6"></path></svg></button>
            <button onclick="insertText('[','](url)')" title="Link" class="t-btn"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></button>
            <button onclick="insertTable()" title="Table" class="t-btn"><svg viewBox="0 0 24 24"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg></button>
            <button onclick="insertText('    ')" title="Indent" class="t-btn"><svg viewBox="0 0 24 24"><path d="M21 5H11"></path><path d="M21 12H11"></path><path d="M21 19H11"></path><path d="m3 8 4 4-4 4"></path></svg></button>
            <div style="width:1px; height:20px; background:rgba(127,127,127,0.15); margin:0 8px;"></div>
            <div class="pill">
                <button id="btn-editing" onclick="setMode('editing')" class="pill-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 21h8"></path><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"></path></svg></button>
                <button id="btn-split" onclick="setMode('split')" class="pill-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M12 3v18"></path></svg></button>
                <button id="btn-sync" onclick="setMode('sync')" class="pill-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path></svg></button>
                <button id="btn-reading" onclick="setMode('reading')" class="pill-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"></path><circle cx="12" cy="12" r="3"></circle></svg></button>
            </div>
        </header>

        <main>
            <div id="editor-container" style="width: 50%; border-right: 1px solid var(--border); display:flex; justify-content:center;">
                <textarea id="editor" spellcheck="false"></textarea>
            </div>
            <div id="resizer"></div>
            <div id="preview-container" style="flex: 1; overflow-y:auto;">
                <div id="preview" class="markdown-body"></div>
            </div>

            <!-- Settings Panel -->
            <div id="settings-panel" class="hidden panel">
                <div class="row" style="margin-bottom:24px; opacity:1;">
                    <span id="version-display" style="font-weight:900; letter-spacing:2px; font-size:10px; opacity:0.3;"></span>
                    <button onclick="toggleSettings()" style="color:var(--accent-color); background:none; border:none; cursor:pointer; font-weight:900; font-size:9px; letter-spacing:1px;">CLOSE</button>
                </div>
                
                <div class="row">
                    <span>Theme</span>
                    <button onclick="cycleTheme()" id="theme-display" class="settings-btn"></button>
                </div>
                
                <div class="row">
                    <span>Accent</span>
                    <div id="accent-grid" style="display:flex; gap:6px;"></div>
                </div>
                
                <div class="row">
                    <span>Links</span>
                    <button onclick="toggleLinkTypes()" id="link-types-btn" class="settings-btn"></button>
                </div>
                
                <div class="row">
                    <span>Alignment</span>
                    <button onclick="toggleTextAlign()" id="align-btn" class="settings-btn"></button>
                </div>
                
                <div class="row">
                    <span>Size</span>
                    <div style="display:flex; align-items:center; gap:12px;">
                        <button onclick="changeFontSize(-1)" style="border:none; background:none; color:inherit; cursor:pointer; font-size:14px; opacity:0.5;">-</button>
                        <span id="font-val" style="font-size:9px; font-weight:900;">16px</span>
                        <button onclick="changeFontSize(1)" style="border:none; background:none; color:inherit; cursor:pointer; font-size:14px; opacity:0.5;">+</button>
                    </div>
                </div>
                
                <div style="margin:24px 0 12px; border-top:1px solid var(--border); padding-top:20px;">
                    <div class="row" style="margin-bottom:12px;">
                        <span style="opacity:0.5;">Font Family</span>
                    </div>
                    <div id="font-family-grid" style="display:flex; gap:4px; margin-bottom:20px;"></div>
                </div>
                
                <button onclick="resetSettings()" class="reset-btn">RESET SETTINGS</button>
            </div>

            <div id="toc-sidebar" class="panel hidden-panel">
                <div class="row" style="margin-bottom:20px; border-bottom:1px solid var(--border); padding-bottom:10px;">
                    <span style="opacity:0.4;">Table of Contents</span>
                </div>
                <div id="toc-content"></div>
            </div>
        </main>

        <footer id="footer">
            <div style="display:flex; align-items:center; gap:16px;">
                <span id="mode-text" style="color:var(--accent-color);">READING</span>
                <button onclick="openFile()" style="background:none; border:none; color:inherit; cursor:pointer; font:inherit; opacity:0.5;">OPEN</button>
                <button onclick="newFile()" style="background:none; border:none; color:inherit; cursor:pointer; font:inherit; opacity:0.5;">NEW</button>
            </div>
            <div id="file-info" style="opacity:0.4; max-width:200px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></div>
            <div style="display:flex; gap:16px;">
                <button onclick="toggleTOC()" style="background:none; border:none; color:inherit; cursor:pointer; font:inherit; opacity:0.5;">TOC</button>
                <button onclick="toggleSettings()" style="background:none; border:none; color:var(--accent-color); cursor:pointer; font:inherit;">SETTINGS</button>
                <div id="footer-actions"></div>
            </div>
        </footer>
    </div>

    <script>
        const ACCENTS = { 
            blue:  { dark:'#89b4fa', light:'#1e66f5', bgDark:'#0d0f16', borderDark:'#1b1e28', toolbarDark:'#08090d' },
            green: { dark:'#a6e3a1', light:'#40a02b', bgDark:'#0d110d', borderDark:'#1b221b', toolbarDark:'#080a08' },
            mauve: { dark:'#cba6f7', light:'#8839ef', bgDark:'#110d16', borderDark:'#201b2a', toolbarDark:'#0a080d' },
            red:   { dark:'#f38ba8', light:'#d20f39', bgDark:'#140d0d', borderDark:'#281b1b', toolbarDark:'#0b0808' }
        };
        
        const state = { md:'', fileName:'Opening.md', mode:'reading', theme:localStorage.getItem('theme')||'light', accentKey:localStorage.getItem('accentKey')||'blue', fontSize:parseInt(localStorage.getItem('size'))||16, fontFamily:localStorage.getItem('font')||'sans', showLinkTypes:localStorage.getItem('linkTypes')==='true', textAlign:localStorage.getItem('textAlign')||'left', isDirty:false, showSettings:false, showTOC:false, splitWidth: 50, assetMap: new Map(), fileHandle: null, mainFileFound: false, version: '0.0.28', isSync: false };

        let editor, preview, editorContainer, resizer;

        window.loadLocalFile = async (name) => {
            const lowerName = name.toLowerCase();
            const fileNameOnly = name.split('/').pop().toLowerCase();
            let blobUrl = null;
            for (let [key, val] of state.assetMap) {
                const lowerKey = key.toLowerCase();
                if (lowerKey === lowerName || lowerKey === fileNameOnly || lowerKey.endsWith('/' + lowerName)) {
                    blobUrl = val;
                    break;
                }
            }
            try {
                const target = blobUrl || name;
                const res = await fetch(target);
                if (res.ok) {
                    state.md = await res.text();
                    state.fileName = name.split('/').pop();
                    if(editor) editor.value = state.md;
                    state.isDirty = false;
                    state.mode = 'reading';
                    updateUI();
                }
            } catch (e) {
                console.error('Error loading file:', e);
            }
        };

        window.getAsset = (path) => {
            if (!path) return '';
            let p = path.replace(/^\.\//, '');
            if (p.startsWith('http') || p.startsWith('blob:')) return p;
            const decodedP = decodeURIComponent(p);
            const fileName = p.split('/').pop();
            const decodedFileName = decodeURIComponent(fileName);
            for (let [key, val] of state.assetMap) {
                const cleanKey = key.replace(/^\.\//, '');
                if (cleanKey === p || cleanKey === decodedP || key === p || key === decodedP || cleanKey.endsWith('/' + p) || key.endsWith('/' + p) || cleanKey === fileName || cleanKey === decodedFileName || key === fileName || key === decodedFileName) {
                    return val;
                }
            }
            return path;
        };

        function updateUI() {
            if (!editor) return;
            const isSplit = state.mode === 'split' || state.mode === 'sync';
            const accent = ACCENTS[state.accentKey];
            const accentHex = state.theme === 'light' ? accent.light : accent.dark;
            
            document.body.className = `theme-${state.theme} font-${state.fontFamily}`;
            const body = document.body;
            if (state.theme === 'dark') {
                body.style.setProperty('--bg', accent.bgDark);
                body.style.setProperty('--border', accent.borderDark);
                body.style.setProperty('--toolbar', accent.toolbarDark);
                body.style.setProperty('--panel-bg', accent.bgDark);
            } else {
                body.style.removeProperty('--bg');
                body.style.removeProperty('--border');
                body.style.removeProperty('--toolbar');
                body.style.removeProperty('--panel-bg');
            }

            document.getElementById('toolbar').classList.toggle('hidden', state.mode === 'reading');
            editorContainer.classList.toggle('hidden', state.mode === 'reading');
            document.getElementById('preview-container').classList.toggle('hidden', state.mode === 'editing');
            resizer.classList.toggle('hidden', !isSplit);
            
            if (state.mode === 'editing') editorContainer.style.width = '100%';
            else if (isSplit) editorContainer.style.width = state.splitWidth + '%';

            document.documentElement.style.setProperty('--accent-color', accentHex);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', accentHex);
            document.getElementById('theme-display').innerText = state.theme + ' mode';
            document.getElementById('font-val').innerText = state.fontSize + 'px';
            document.getElementById('align-btn').innerText = state.textAlign === 'justify' ? 'FULL BLOCK' : 'PLAIN';
            document.getElementById('file-info').innerText = `[${state.fileName}${state.isDirty?' *':''}]`;
            document.getElementById('mode-text').innerText = state.isDirty ? 'EDITING' : state.mode.toUpperCase();
            document.getElementById('link-types-btn').innerText = state.showLinkTypes ? 'VISIBLE' : 'ACCENT';
            document.getElementById('version-display').innerText = `v${state.version}`;
            
            document.getElementById('settings-panel').classList.toggle('hidden', !state.showSettings);
            document.getElementById('toc-sidebar').classList.toggle('hidden-panel', !state.showTOC);

            const fa = document.getElementById('footer-actions');
            fa.innerHTML = state.mode === 'reading' ? `<button onclick="setMode('editing')" style="color:var(--accent-color); background:none; border:none; cursor:pointer; font:inherit;">EDIT</button>` : `<button onclick="saveFile()" style="color:var(--accent-color); background:none; border:none; cursor:pointer; font:inherit;">SAVE</button>`;

            document.getElementById('accent-grid').innerHTML = Object.keys(ACCENTS).map(k => `<div onclick="setAccent('${k}')" class="dot ${state.accentKey===k?'active':''}" style="background:${state.theme==='light'?ACCENTS[k].light:ACCENTS[k].dark}"></div>`).join('');
            document.getElementById('font-family-grid').innerHTML = ['sans', 'serif', 'mono'].map(f => `<button onclick="setFont('${f}')" style="flex:1; background:${state.fontFamily===f?'var(--accent-color)':'rgba(0,0,0,0.1)'}; color:${state.fontFamily===f?'white':'inherit'}; border:none; padding:6px; border-radius:8px; cursor:pointer; font-size:9px; font-weight:900;">${f.toUpperCase()}</button>`).join('');

            const scales = { sans: 1.0, serif: 1.0, mono: 1.0 };
            const visualSize = state.fontSize * (scales[state.fontFamily] || 1.0);
            editor.style.fontSize = visualSize + 'px';
            preview.style.fontSize = visualSize + 'px';
            preview.style.textAlign = state.textAlign;
            preview.style.maxWidth = (720 + (state.fontSize - 16) * 40) + 'px';

            const renderer = new marked.Renderer();
            renderer.heading = (arg1, arg2) => {
                const text = typeof arg1 === 'object' ? arg1.text : arg1;
                const level = typeof arg1 === 'object' ? arg1.depth : arg2;
                return `<h${level} id="${String(text).toLowerCase().replace(/[^\w]+/g, '-')}">${text}</h${level}>`;
            };
            renderer.image = (arg1, arg2, arg3) => {
                let href = typeof arg1 === 'object' ? arg1.href : arg1;
                let text = typeof arg1 === 'object' ? arg1.text : arg3;
                if (!href) return '';
                let src = getAsset(href);
                return `<img src="${src}" alt="${text || ''}" />`;
            };
            renderer.link = (arg1, arg2, arg3) => {
                let href = typeof arg1 === 'object' ? arg1.href : arg1;
                let text = typeof arg1 === 'object' ? arg1.text : arg3;
                if (href.match(/\.(jpg|jpeg|png|gif|svg|webp)$/i)) {
                    let src = getAsset(href);
                    return `<img src="${src}" alt="${text || ''}" />`;
                }
                const isAnchor = href.startsWith('#');
                const isMd = href.match(/\.(md|markdown)$/i);
                const isWeb = href.startsWith('http');
                let linkClass = '';
                if (state.showLinkTypes) {
                    if (isAnchor) linkClass = 'link-anchor';
                    else if (isMd) linkClass = 'link-file';
                    else if (isWeb) linkClass = 'link-web';
                }
                if (isAnchor) {
                    const targetId = href.substring(1).toLowerCase().replace(/[^\w]+/g, '-');
                    return `<a href="${href}" onclick="event.preventDefault(); document.getElementById('${targetId}')?.scrollIntoView({behavior:'smooth'});" class="${linkClass}">${text}</a>`;
                }
                if (isMd) {
                    return `<a href="${href}" onclick="event.preventDefault(); loadLocalFile('${href}');" class="${linkClass}">${text}</a>`;
                }
                const target = isWeb ? ' target="_blank" rel="noopener noreferrer"' : '';
                return `<a href="${href}"${target} class="${linkClass}">${text}</a>`;
            };
            marked.setOptions({ renderer });
            preview.innerHTML = marked.parse(state.md);

            const headers = Array.from(new DOMParser().parseFromString(marked.parse(state.md), 'text/html').querySelectorAll('h1, h2, h3'));
            document.getElementById('toc-content').innerHTML = headers.length ? headers.map(h => `<button onclick="document.getElementById('${String(h.innerText).toLowerCase().replace(/[^\w]+/g, '-')}').scrollIntoView({behavior:'smooth'});" class="toc-btn" style="padding-left:${h.tagName==='H1'?'0':h.tagName==='H2'?'12px':'24px'}">${h.innerText}</button>`).join('') : '<div style="font-size:10px; opacity:0.3;">No headers found</div>';
            
            ['editing', 'split', 'reading'].forEach(m => { const b = document.getElementById('btn-'+m); if(b) b.classList.toggle('active', state.mode===m); });
            const sBtn = document.getElementById('btn-sync');
            if(sBtn) {
                sBtn.classList.toggle('active', state.isSync);
                sBtn.style.opacity = state.mode === 'split' ? '1' : '0.3';
            }
        }

        window.setMode = m => { 
            if (m === 'sync') {
                state.isSync = !state.isSync;
                if (state.isSync) state.mode = 'split';
            } else {
                state.mode = m;
                if (m !== 'split') state.isSync = false;
            }
            updateUI(); 
        };
        window.setAccent = k => { state.accentKey = k; localStorage.setItem('accentKey', k); updateUI(); };
        window.setFont = f => { state.fontFamily = f; localStorage.setItem('font', f); updateUI(); };
        window.changeFontSize = d => { state.fontSize = Math.max(12, Math.min(32, state.fontSize + d)); localStorage.setItem('size', state.fontSize); updateUI(); };
        window.cycleTheme = () => { const t=['light','dim','dark']; state.theme=t[(t.indexOf(state.theme)+1)%3]; localStorage.setItem('theme',state.theme); updateUI(); };
        window.toggleSettings = () => { state.showSettings = !state.showSettings; if(state.showSettings) state.showTOC=false; updateUI(); };
        window.toggleTOC = () => { state.showTOC = !state.showTOC; if(state.showTOC) state.showSettings=false; updateUI(); };
        window.toggleLinkTypes = () => { state.showLinkTypes = !state.showLinkTypes; localStorage.setItem('linkTypes', state.showLinkTypes); updateUI(); };
        window.toggleTextAlign = () => { state.textAlign = state.textAlign === 'left' ? 'justify' : 'left'; localStorage.setItem('textAlign', state.textAlign); updateUI(); };
        window.resetSettings = () => { if(confirm('Reset all settings to default?')) { localStorage.clear(); location.reload(); } };
        window.insertText = (b,a='') => { if(!editor) return; const s=editor.selectionStart, e=editor.selectionEnd; state.md=state.md.substring(0,s)+b+state.md.substring(s,e)+a+state.md.substring(e); editor.value=state.md; state.isDirty=true; updateUI(); };
        window.insertTable = () => insertText('\n| Col 1 | Col 2 |\n| --- | --- |\n| Item 1 | Item 2 |');
        
        const isMarkdownFile = (name) => /\.(md|markdown|mdown|mkdn|mdwn|mkd|rmd|text)$/i.test(name);

        window.openFile = async () => {
            if (window.showOpenFilePicker) {
                try {
                    const handles = await window.showOpenFilePicker({ multiple: true, types: [{ description: 'Markdown Files', accept: { 'text/markdown': ['.md', '.markdown', '.mdown', '.mkdn', '.mdwn', '.mkd', '.rmd', '.text'], 'text/plain': ['.md', '.markdown', '.txt'] } }] });
                    state.assetMap.clear(); state.mainFileFound = false;
                    let mainMd = null;
                    for (const h of handles) {
                        const f = await h.getFile(); const blobUrl = URL.createObjectURL(f); state.assetMap.set(f.name, blobUrl);
                        if (isMarkdownFile(f.name)) { if (!mainMd || f.name.toLowerCase() === 'readme.md') { mainMd = f; state.fileHandle = h; } }
                    }
                    if (mainMd) { state.md = await mainMd.text(); state.fileName = mainMd.name; if(editor) editor.value = state.md; state.isDirty = false; updateUI(); }
                } catch (e) {}
            } else {
                const i = document.createElement('input'); i.type = 'file'; i.multiple = true; i.accept = '.md,.markdown,.mdown,.mkdn,.mdwn,.mkd,.rmd,.text,text/markdown,text/plain';
                i.onchange = async e => {
                    const files = Array.from(e.target.files); if (files.length === 0) return;
                    state.assetMap.clear(); state.mainFileFound = false;
                    let mainMd = null;
                    for (const f of files) {
                        const blobUrl = URL.createObjectURL(f); state.assetMap.set(f.name, blobUrl);
                        if (isMarkdownFile(f.name)) { if (!mainMd || f.name.toLowerCase() === 'readme.md') mainMd = f; }
                    }
                    if (mainMd) { state.md = await mainMd.text(); state.fileName = mainMd.name; if(editor) editor.value = state.md; state.isDirty = false; state.fileHandle = null; updateUI(); }
                }; i.click();
            }
        };

        window.newFile = () => { state.md = '# New File\n'; state.fileName = 'Untitled.md'; state.fileHandle = null; state.isDirty = false; state.mode = 'editing'; if(editor) editor.value = state.md; updateUI(); };
        window.saveFile = async () => {
            if (state.fileHandle) {
                try { const writable = await state.fileHandle.createWritable(); await writable.write(state.md); await writable.close(); state.isDirty = false; updateUI(); return; } catch (e) { return window.saveFileAs(); }
            } else { return window.saveFileAs(); }
        };

        window.saveFileAs = async () => {
            if (window.showSaveFilePicker) {
                try {
                    let suggestedName = state.fileName.split('/').pop();
                    if (!suggestedName.toLowerCase().endsWith('.md') && !suggestedName.toLowerCase().endsWith('.markdown')) suggestedName += '.md';
                    const h = await window.showSaveFilePicker({ suggestedName: suggestedName, types: [{ description: 'Markdown Files', accept: { 'text/markdown': ['.md', '.markdown'] } }] });
                    const w = await h.createWritable(); await w.write(state.md); await w.close();
                    state.fileName = h.name; state.fileHandle = h; state.isDirty = false; updateUI();
                } catch (e) {}
            } else {
                const b = new Blob([state.md], {type: 'text/markdown'}); const a = document.createElement('a');
                let downloadName = state.fileName.split('/').pop();
                if (!downloadName.toLowerCase().endsWith('.md') && !downloadName.toLowerCase().endsWith('.markdown')) downloadName += '.md';
                a.href = URL.createObjectURL(b); a.download = downloadName; a.click(); state.isDirty = false; updateUI();
            }
        };

        async function readEntry(entry, path = '') {
            try {
                if (entry.isFile) {
                    const file = await new Promise((res, rej) => entry.file(res, rej)); const fullPath = (path + entry.name).replace(/^\//, ''); const blobUrl = URL.createObjectURL(file); state.assetMap.set(fullPath, blobUrl); state.assetMap.set(entry.name, blobUrl);
                    if (isMarkdownFile(file.name)) { if (!state.mainFileFound || file.name.toLowerCase() === 'readme.md') { state.md = await file.text(); state.fileName = fullPath; if(editor) editor.value = state.md; state.isDirty = false; state.mainFileFound = true; } }
                } else if (entry.isDirectory) {
                    const reader = entry.createReader();
                    const readAllEntries = async () => { const entries = await new Promise((res, rej) => reader.readEntries(res, rej)); if (entries.length > 0) { for (const e of entries) await readEntry(e, path + entry.name + '/'); await readAllEntries(); } };
                    await readAllEntries();
                }
            } catch (err) {}
        }

        window.addEventListener('DOMContentLoaded', () => {
            editor = document.getElementById('editor'); preview = document.getElementById('preview'); editorContainer = document.getElementById('editor-container'); resizer = document.getElementById('resizer');
            if (editor) editor.oninput = () => { state.md = editor.value; state.isDirty = true; updateUI(); };
            let isResizing = false;
            resizer.addEventListener('mousedown', () => { isResizing = true; document.body.style.cursor = 'col-resize'; resizer.classList.add('resizing'); });
            window.addEventListener('mousemove', e => { if (!isResizing) return; const w = (e.clientX / window.innerWidth) * 100; if (w > 20 && w < 80) { state.splitWidth = w; editorContainer.style.width = w + '%'; }});
            window.addEventListener('mouseup', () => { isResizing = false; document.body.style.cursor = 'default'; resizer.classList.remove('resizing'); });

            // Sync Scroll logic
            const previewContainer = document.getElementById('preview-container');
            let isSyncingEditor = false;
            let isSyncingPreview = false;

            editor.addEventListener('scroll', () => {
                if (!state.isSync || isSyncingEditor) { isSyncingEditor = false; return; }
                isSyncingPreview = true;
                const percentage = editor.scrollTop / (editor.scrollHeight - editor.clientHeight);
                previewContainer.scrollTop = percentage * (previewContainer.scrollHeight - previewContainer.clientHeight);
            });

            previewContainer.addEventListener('scroll', () => {
                if (!state.isSync || isSyncingPreview) { isSyncingPreview = false; return; }
                isSyncingEditor = true;
                const percentage = previewContainer.scrollTop / (previewContainer.scrollHeight - previewContainer.clientHeight);
                editor.scrollTop = percentage * (editor.scrollHeight - editor.clientHeight);
            });

            window.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); document.getElementById('root').style.boxShadow = "inset 0 -100px 100px -50px var(--accent-color)"; });
            window.addEventListener('dragenter', e => { e.preventDefault(); e.stopPropagation(); });
            window.addEventListener('dragleave', () => document.getElementById('root').style.boxShadow = "none");
            window.addEventListener('drop', async e => {
                e.preventDefault(); e.stopPropagation(); document.getElementById('root').style.boxShadow = "none"; state.assetMap.clear(); state.mainFileFound = false; state.fileHandle = null;
                const items = e.dataTransfer.items ? Array.from(e.dataTransfer.items) : []; const files = e.dataTransfer.files ? Array.from(e.dataTransfer.files) : [];
                for (const item of items) { if (item.kind === 'file' && item.getAsFileSystemHandle) { try { const handle = await item.getAsFileSystemHandle(); if (handle && handle.kind === 'file' && isMarkdownFile(handle.name)) { if (!state.fileHandle || handle.name.toLowerCase() === 'readme.md') state.fileHandle = handle; } } catch(err) {} } }
                if (items.length > 0 && items[0].webkitGetAsEntry) { for (const item of items) { const entry = item.webkitGetAsEntry(); if (entry) await readEntry(entry); } }
                if (!state.mainFileFound && files.length > 0) { for (const f of files) { const blobUrl = URL.createObjectURL(f); state.assetMap.set(f.name, blobUrl); if (isMarkdownFile(f.name)) { if (!state.mainFileFound || f.name.toLowerCase() === 'readme.md') { try { state.md = await f.text(); state.fileName = f.name; if(editor) editor.value = state.md; state.isDirty = false; state.mainFileFound = true; } catch(err) {} } } } }
                if (state.mainFileFound) state.mode = 'reading'; updateUI();
            });
            window.addEventListener('keydown', e => {
                const isCmd = e.metaKey || e.ctrlKey;
                if (isCmd && e.key === 'Enter') { e.preventDefault(); setMode(state.mode === 'reading' ? 'editing' : 'reading'); }
                if (isCmd && !e.shiftKey && e.key === 's') { e.preventDefault(); saveFile(); }
                if (isCmd && e.shiftKey && e.key === 's') { e.preventDefault(); saveFileAs(); }
                if (isCmd && e.key === 'o') { e.preventDefault(); openFile(); }
            });

            if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed:', err)); }); }

            if ('launchQueue' in window) {
                window.launchQueue.setConsumer(async (launchParams) => {
                    if (launchParams.files && launchParams.files.length) {
                        state.assetMap.clear(); state.mainFileFound = false;
                        for (const handle of launchParams.files) {
                            const file = await handle.getFile();
                            const blobUrl = URL.createObjectURL(file);
                            state.assetMap.set(file.name, blobUrl);
                            const isMd = isMarkdownFile(file.name);
                            const isTxt = file.name.endsWith('.txt');
                            if (isMd || isTxt) {
                                if (!state.mainFileFound || file.name.toLowerCase() === 'readme.md') {
                                    state.md = await file.text();
                                    state.fileName = file.name;
                                    state.fileHandle = handle;
                                    if(editor) editor.value = state.md;
                                    state.isDirty = false;
                                    state.mainFileFound = true;
                                }
                            }
                        }
                        if (state.mainFileFound) state.mode = 'reading';
                        updateUI();
                    }
                });
            }

            // Load default file if none was launched via OS
            (async () => {
                await new Promise(r => setTimeout(r, 100)); // Brief wait for launchQueue
                if (state.mainFileFound) return;
                try { 
                    const r = await fetch('Opening.md'); 
                    if (r.ok && !state.mainFileFound) {
                        state.md = await r.text();
                        if(editor) editor.value = state.md; 
                        updateUI();
                    }
                } catch (e) { 
                    if (!state.mainFileFound) {
                        state.md = '# mark it down'; 
                        if(editor) editor.value = state.md; 
                        updateUI();
                    }
                }
            })();
        });
    </script>
</body>
