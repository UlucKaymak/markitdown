<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Uluç Kaymak</title>
    <link rel="icon" type="image/png" href="design/favicon-main.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="../design/style.css">
    <link rel="stylesheet" href="../design/css/blog.css">
</head>

<body class="text-based-page">
    <!-- Left Sidebar -->
    <aside id="sidebar-container" class="left-sidebar"></aside>

    <div class="page-content">
        <main class="blog-main">
            <div class="blog-header">
                <span class="eyebrow">Writing</span>
                <h2>Blog</h2>
                <p>Mostly my research and UX reports.</p>
            </div>
            <div class="blog-list"></div>
        </main>
    </div>

    <!-- Reusing lightbox for potential images in blog posts -->
    <div id="image-lightbox" class="lightbox-overlay">
        <span class="lightbox-close">&times;</span>
        <button id="lightbox-prev" class="lightbox-prev">&lt;</button>
        <img class="lightbox-content" id="expanded-image" src="" alt="expanded view">
        <button id="lightbox-next" class="lightbox-next">&gt;</button>
    </div>

    <script src="../design/sidebar.js"></script>
    <script src="/blog/blog.js"></script>
</body>

</html>
